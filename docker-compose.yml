version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ai-ecommerce-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ai-ecommerce-redis
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service/Dockerfile
    container_name: ai-ecommerce-ai
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: ai-ecommerce-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - ai-service

  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    container_name: ai-ecommerce-client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongodb_data:
